<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-[#050505]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#050505" />
    <title>WEB⚡BITS — Creative Technology Studio</title>
    <meta name="description" content="WEB⚡BITS is an interactive creative technology studio and digital development practice by Infas.mk (NIT Raipur). Building memorable web experiences, 3D platforms, and digital products." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #050505;
        color: #f8f8f8;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      .font-space { font-family: 'Space Grotesk', sans-serif; }
      ::selection { background: #3b82f6; color: #fff; }
      
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #1e2230; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #2563eb; }
      
      .bg-noise {
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.035;
        pointer-events: none;
      }

      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.04) 50%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 9999;
      }

      /* Dot Grid Pattern */
      .bg-grid {
        background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 0);
        background-size: 40px 40px;
        background-position: -19px -19px;
      }

      /* Custom mask for smooth marquee edges */
      .marquee-mask {
        mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="bg-noise fixed inset-0 pointer-events-none z-[9998]"></div>
    <div class="scanlines"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
