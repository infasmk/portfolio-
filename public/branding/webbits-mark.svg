<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Left outer facet: polished silver -->
    <linearGradient id="wbMarkLeftGrad" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Inner fold / shadow facet: architectural dark metallic slate -->
    <linearGradient id="wbMarkFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Center stem front face: bright platinum silver -->
    <linearGradient id="wbMarkMidFrontGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F8FAFC" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Center stem side bevel: subtle shadow for 3D depth -->
    <linearGradient id="wbMarkMidBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Electric blue lightning bolt: controlled vivid energy -->
    <linearGradient id="wbMarkBoltGrad" x1="30%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#1683FF" />
      <stop offset="35%" stop-color="#0091FF" />
      <stop offset="75%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
  </defs>

  <!-- 1. Left outer stem -->
  <polygon points="18,61 58,61 96,122 86,174" fill="url(#wbMarkLeftGrad)" />

  <!-- 2. Inner Ribbon Shadow Fold -->
  <polygon points="92,88 96,122 86,174 105,124" fill="url(#wbMarkFoldGrad)" />

  <!-- 3. Center Spine Stem (Front face) -->
  <polygon points="92,88 126,88 152,176 105,124" fill="url(#wbMarkMidFrontGrad)" />

  <!-- 3b. Center Spine Right Bevel -->
  <polygon points="126,88 132,94 156,182 152,176" fill="url(#wbMarkMidBevelGrad)" />

  <!-- 4. Integrated Electric Lightning Bolt -->
  <polygon points="214,35 155,114 179,116 156,182 218,98 192,96" fill="url(#wbMarkBoltGrad)" />
</svg>